<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <!-- 
        primary = blue
        secondary = gray
        info = skyBlue
        danger = red
        warning = Yellow
        success = green
        dark = black
        white = white
        light = light gray

        .text-primary
        .bg-primary
        .text-bg-primary

        .text-center

        .btn btn-primary

    -->
    <h1 class="text-bg-primary text-center">iGAP Technologies</h1>
    <h1 class="text-bg-secondary text-center">iGAP Technologies</h1>
    <h1 class="text-bg-info text-center">iGAP Technologies</h1>
    <h1 class="text-bg-danger text-center">iGAP Technologies</h1>
    <h1 class="text-bg-warning text-center">iGAP Technologies</h1>
    <h1 class="text-bg-success text-center">iGAP Technologies</h1>
    <h1 class="text-bg-light text-center">iGAP Technologies</h1>
    <h1 class="text-bg-dark text-center">iGAP Technologies</h1>

    <hr>

    <button>Button</button>
    <button class="btn btn-primary">Button</button>
    <button class="btn btn-secondary">Button</button>
    <button class="btn btn-info">Button</button>
    <button class="btn btn-danger">Button</button>
    <button class="btn btn-warning">Button</button>
    <button class="btn btn-success">Button</button>
    <button class="btn btn-dark">Button</button>
    <button class="btn btn-light">Button</button>

    <hr>
    <h1>.btn-outline-*</h1>
    <button class="btn btn-outline-primary">Button</button>
    <button class="btn btn-outline-secondary">Button</button>
    <button class="btn btn-outline-info">Button</button>
    <button class="btn btn-outline-danger">Button</button>
    <button class="btn btn-outline-warning">Button</button>
    <button class="btn btn-outline-success">Button</button>
    <button class="btn btn-outline-dark">Button</button>
    <button class="btn btn-outline-light">Button</button>

    <hr>

    <h1>btn size</h1>
    <button class="btn btn-primary btn-sm">Button</button>
    <button class="btn btn-primary">Button</button>
    <button class="btn btn-primary btn-lg">Button</button>

    <hr>

    <div class="btn-group">
        <button class="btn btn-primary active">Home</button>
        <button class="btn btn-primary">About</button>
        <button class="btn btn-primary">Contact</button>
    </div>



    <br><br><br>
</body>
</html>

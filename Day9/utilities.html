<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        span{
            display: inline-block;
            height: 100px;
            width: 100px;
            background-color: rgb(7, 128, 11);
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Utilities Classes</h1>
        <hr>

        <!-- You Can use from 1 - 5  for border-* -->
        <span class="border border-5"></span>

        <span class="border border-5 border-warning"></span>
        <span class="border border-5 border-dark"></span>

        <hr>

        <span class="rounded"></span>
        <span class="rounded-1"></span>
        <span class="rounded-2"></span>
        <span class="rounded-3"></span>
        <span class="rounded-4"></span>
        <span class="rounded-5"></span>
        <span class="rounded-circle"></span>



    </div>
</body>
</html>

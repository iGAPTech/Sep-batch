<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .loginBox{
            padding: 40px;
            background-color: rgb(182, 236, 236);
            width: 30%;
            margin: auto;
            margin-top: 100px;
            border-radius: 20px;
        }
        .text-center{
            text-align: center;
        }

        .loginForm{
            padding: 30px;
        }

        .mb-2{
            margin-bottom: 12px;
        }

        input{
            width: 90%;
            padding: 8px;
            margin-top: 6px;
            border-radius: 8px;
        }

        input[type=radio]{
            width: 10px;
            padding: 8px;
            border-radius: 8px;
            margin: 10px;
        }

        select{
            width: 95%;
            padding: 8px;
            margin-top: 6px;
            border-radius: 8px;
        }



        .btn{
            width: 100px;
            padding: 8px;
            font-size: 20px;
            background-color: tomato;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="loginBox">
            <h1 class="text-center">Register</h1>
            <hr>

        <form action="" class="loginForm">
            <div class="mb-2">
                <label for="">Name</label> <br>
                <input type="text" name="name" id="" placeholder="Enter Name" required>
            </div>
            <div class="mb-2">
                <label for="">Email</label> <br>
                <input type="email" name="email" id="" placeholder="Enter Email" required>
            </div>

            <div class="mb-2">
                <label for="">Department</label> <br>
                <select name="dept" id="" required>
                    <option value="">Select Department</option>
                    <option value="Computer">Computer</option>
                    <option value="IT">IT</option>
                    <option value="ETC">E&TC</option>
                </select>
            </div>

            <div class="mb-2">
                <label for="">Select Gender</label> <br>
                <input type="radio" name="gender" id="male">
                <label for="male">Male</label> 
                <input type="radio" name="gender" id="female">
                <label for="female">Female</label> 
            </div>

            <div class="mb-2">
                <label for="">Password</label> <br>
                <input type="password" name="password" id="" placeholder="Enter Password" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn">Register</button>

                <br><br>
                <h4>Already Register ? <a href="loginForm.html">Click here to login..</a></h5>
            </div>
        </form>
    </div>
</body>
</html>
